name: Build and verify Documents Studio 6.0
on:
  push:
    paths:
      - '.github/workflows/startup-diagnostics.yml'
      - 'Documents-MotoG2024-AndroidProject/app/src/main/java/com/example/docs/**'
      - 'Documents-MotoG2024-AndroidProject/app/build.gradle'
      - 'Documents-MotoG2024-AndroidProject/gradle.properties'
      - 'Documents-MotoG2024-AndroidProject/app/src/main/AndroidManifest.xml'
  workflow_dispatch:

jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build complete Documents Studio app
        working-directory: Documents-MotoG2024-AndroidProject
        run: gradle assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch app in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-window -no-audio -no-boot-anim
          script: |
            adb install -r Documents-MotoG2024-AndroidProject/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            echo "=== Launch main app ==="
            adb shell am start -W -n com.example.docs.debug/com.example.docs.MainActivity
            sleep 5
            adb shell pidof com.example.docs.debug | tee startup-pid.txt
            echo "=== Launch toolbox ==="
            adb shell am start -W -n com.example.docs.debug/com.example.docs.ToolboxActivity
            sleep 5
            adb shell pidof com.example.docs.debug | tee -a startup-pid.txt
            adb shell dumpsys activity activities > startup-activities.txt
            adb logcat -d -v threadtime > startup-logcat.txt
            echo "=== Check fatal exceptions for our package ==="
            if grep -A 10 'FATAL EXCEPTION' startup-logcat.txt | grep -q 'Process: com.example.docs.debug'; then
              grep -A 45 -B 3 'FATAL EXCEPTION' startup-logcat.txt | tail -130
              exit 1
            fi
            echo "Main and toolbox both launched without detected fatal exceptions."
      - name: Upload startup diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-startup-logcat
          path: |
            startup-logcat.txt
            startup-pid.txt
            startup-activities.txt
          if-no-files-found: ignore
      - name: Upload corrected APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Documents-Studio-6-PDF-OCR-APK
          path: Documents-MotoG2024-AndroidProject/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

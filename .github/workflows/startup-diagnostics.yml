name: Diagnose Android startup crash
on:
  push:
    paths:
      - '.github/workflows/startup-diagnostics.yml'
      - 'Documents-MotoG2024-AndroidProject/app/src/main/java/com/example/docs/MainActivity.java'
  workflow_dispatch:

jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build untouched app
        working-directory: Documents-MotoG2024-AndroidProject
        run: gradle assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch app in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-window -no-audio -no-boot-anim
          script: |
            adb install -r Documents-MotoG2024-AndroidProject/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.example.docs.debug/com.example.docs.MainActivity || true
            sleep 6
            adb logcat -d -v threadtime > startup-logcat.txt
            adb shell pidof com.example.docs.debug > startup-pid.txt || true
            adb shell dumpsys activity activities > startup-activities.txt || true
            echo "==== STARTUP PROCESS ===="
            cat startup-pid.txt
            echo "==== JAVA EXCEPTIONS ===="
            grep -A 45 -B 3 -E "FATAL EXCEPTION|AndroidRuntime|Process: com.example.docs.debug|Error inflating|Could not start|Unable to start activity" startup-logcat.txt | tail -200 || true
      - name: Upload startup diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-startup-logcat
          path: |
            startup-logcat.txt
            startup-pid.txt
            startup-activities.txt
          if-no-files-found: ignore

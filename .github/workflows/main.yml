
name: Build Moto G 2024 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Docs APK
        working-directory: DocsStudio-MotoG2024-AndroidProject
        run: gradle assembleDebug --no-daemon

      - name: Upload finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Docs-Moto-G-2024-APK
          path: DocsStudio-MotoG2024-AndroidProject/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
